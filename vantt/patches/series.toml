# Patch series applied by vantt/scripts/catchup.mjs on top of the upstream tag in
# vantt/upstream.pin. Patches are applied in file order with `git am --3way`.
#
# [[patches]]
# id = "owner-gates"                         # required, unique, kebab-case
# name = "feat(workflow): owner gates enforced by the server"   # required, commit subject
# patch_file = "0001-owner-gates.patch"     # required, `git format-patch` output
# metadata_file = "0001-owner-gates.spec.md" # required: requirement, invariants, touch points, how to rewrite on conflict
# upstream_status = "unsubmitted"            # unsubmitted | issue_opened | pr_opened | merged | rejected ("merged" = skipped)
# upstream_ref = ""                          # issue or PR link
# touches = ["server/internal/issueworkflow/issueworkflow.go"]
# test_command = "cd server && go test ./internal/issueworkflow/..."
# probe = "vantt/probes/owner-gates.sh"      # behaviour check against a running instance
#
# Planned order (vantt/plans/plan.md): F0 fork-identity, F1 owner-gates, F2 goals,
# F3 workflow-by-type, F4 boards, F5 decisions, F7 parent-child, F8 artifact-reader,
# F6 budgets (last).

[[patches]]
id = "owner-gates"
name = "feat(workflow): agents cannot move an issue out of a step a person handles"
patch_file = "0001-owner-gates.patch"
metadata_file = "0001-owner-gates.spec.md"
upstream_status = "unsubmitted"
upstream_ref = ""
touches = ["server/internal/issueworkflow/issueworkflow.go", "server/internal/handler/issue_workflow_entry.go", "server/internal/handler/issue.go", "server/internal/handler/vantt_owner_gates_test.go"]
test_command = "cd server && go run ./cmd/migrate up >/dev/null && go test ./internal/handler/ -run 'OwnerGate|AgentStepIsNotAGate' -count=1"

[[patches]]
id = "approval-panel"
name = "feat(issues): approval panel for the person a workflow step waits on"
patch_file = "0002-approval-panel.patch"
metadata_file = "0002-approval-panel.spec.md"
upstream_status = "unsubmitted"
upstream_ref = ""
touches = ["packages/views/workflows/approval-panel.tsx", "packages/views/issues/components/issue-detail.tsx", "packages/views/locales/*/issues.json"]
test_command = "pnpm install --frozen-lockfile --ignore-scripts >/dev/null && cd packages/views && npx vitest run workflows/approval-panel.test.tsx locales"

[[patches]]
id = "goals"
name = "feat(goals): goals with a number, a deadline, history and linked work"
patch_file = "0003-goals.patch"
metadata_file = "0003-goals.spec.md"
upstream_status = "unsubmitted"
upstream_ref = ""
touches = ["server/migrations/9001_vantt_goal*", "server/pkg/db/queries/goal.sql", "server/pkg/db/generated/goal.sql.go", "server/pkg/db/generated/models.go", "server/internal/handler/vantt_goal.go", "server/cmd/server/router.go"]
test_command = "cd server && go run ./cmd/migrate up >/dev/null && go test ./internal/handler/ -run 'Goal' -count=1"
